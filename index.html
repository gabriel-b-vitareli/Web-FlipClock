<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip Clock</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- CANVASES E BACKGROUNDS -->
<canvas class="fx-canvas" id="fx-canvas"></canvas>
<div class="custom-bg" id="custom-bg"></div>
<div class="custom-bg-overlay" id="custom-bg-overlay"></div>

<!-- SIDEBAR DE NAVEGAÇÃO -->
<nav class="sidebar" id="sidebar">
  <button class="nav-btn active" data-page="clock" title="Relógio (tecla 1)">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
    </svg>
    <span class="nav-label">Relógio</span>
  </button>

  <button class="nav-btn" data-page="stopwatch" title="Cronômetro (tecla 2)">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13" r="8"/>
      <polyline points="12 9 12 13 14.5 15.5"/>
      <path d="M9 2h6"/>
      <path d="M12 2v3"/>
    </svg>
    <span class="nav-label">Cronômetro</span>
  </button>

  <button class="nav-btn" data-page="timer" title="Temporizador (tecla 3)">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="7" width="20" height="15" rx="2"/>
      <path d="M16 2H8"/>
      <path d="M12 12v4"/>
      <path d="M10 14h4"/>
    </svg>
    <span class="nav-label">Timer</span>
  </button>

  <div class="nav-divider"></div>

  <!-- INTERFACES / SKINS -->
  <button class="nav-btn" id="btn-skin" title="Trocar skin/layout (tecla S)">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      <line x1="9" y1="3" x2="9" y2="21"/>
      <line x1="17" y1="3" x2="17" y2="21"/>
    </svg>
    <span class="nav-label">Interface</span>
  </button>

  <!-- TEMA -->
  <button class="nav-btn" id="btn-theme" title="Trocar tema (tecla T)">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
    <span class="nav-label">Tema</span>
  </button>

  <!-- CLEAN MODE -->
  <button class="nav-btn" id="btn-clean" title="Modo zen (tecla Z ou F)">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
      <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
      <line x1="1" y1="1" x2="23" y2="23"/>
    </svg>
    <span class="nav-label">Zen</span>
  </button>
</nav>

<!-- PAINEL DE SKINS -->
<div class="theme-panel" id="skins-panel">
  <div class="theme-panel-title">Skins / Interfaces</div>
  <div class="theme-grid" id="skins-grid"></div>
</div>

<!-- PAINEL DE TEMAS -->
<div class="theme-panel theme-panel--scroll" id="theme-panel">
  <div class="theme-panel-title">Temas</div>
  <div class="theme-grid" id="theme-grid"></div>

  <div class="nav-divider" style="width: 100%; margin: 16px 0;"></div >

  <div class="theme-panel-title">Fundo Personalizado</div>
  <div class="custom-bg-controls">
    <label class="custom-file-upload">
      <input type="file" id="bg-upload" accept="image/*, image/gif">
      <span>Upload Imagem/GIF</span>
    </label>
    <button class="sw-btn sw-btn--ghost" id="bg-remove" style="width: 100%; padding: 6px; font-size: 10px; margin-top: 8px;">Remover Fundo</button>
    
    <div class="control-group">
      <div class="control-label">Opacidade Escura: <span id="val-bg-opacity">50%</span></div>
      <input type="range" id="bg-opacity" min="0" max="1" step="0.05" value="0.5">
    </div>
    
    <div class="control-group">
      <div class="control-label">Desfoque (Blur): <span id="val-bg-blur">0px</span></div>
      <input type="range" id="bg-blur" min="0" max="20" step="1" value="0">
    </div>
  </div>

  <div class="nav-divider" style="width: 100%; margin: 16px 0;"></div >
  
  <button class="sw-btn" id="btn-create-theme" style="width: 100%; font-size: 11px; padding: 8px 12px;">Criar Tema Customizado</button>
</div>

<!-- MODAL DE CRIAR TEMA -->
<div class="modal hidden" id="theme-modal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title">Novo Tema</span>
      <button class="modal-close" id="modal-close-btn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="theme-name-input">Nome do Tema</label>
        <input type="text" id="theme-name-input" placeholder="Meu Tema">
      </div>
      
      <div class="color-pickers-grid">
        <div class="picker-group">
          <label>Fundo (BG)</label>
          <input type="color" id="pick-bg" value="#0e0e0e">
        </div>
        <div class="picker-group">
          <label>Card Superior</label>
          <input type="color" id="pick-card" value="#1a1a1a">
        </div>
        <div class="picker-group">
          <label>Card Inferior</label>
          <input type="color" id="pick-card-bot" value="#141414">
        </div>
        <div class="picker-group">
          <label>Dígitos (Texto)</label>
          <input type="color" id="pick-text" value="#f0f0f0">
        </div>
        <div class="picker-group">
          <label>Texto Muted</label>
          <input type="color" id="pick-muted" value="#555555">
        </div>
        <div class="picker-group">
          <label>Destaque (Accent)</label>
          <input type="color" id="pick-accent" value="#ff6060">
        </div>
      </div>
      
      <!-- Mini Preview -->
      <div class="theme-preview-box">
        <div class="mini-clock-wrap">
          <div class="mini-unit">
            <div class="mini-card-container">
              <div class="mini-card-top">1</div>
              <div class="mini-card-bot">1</div>
            </div>
            <span class="mini-label">horas</span>
          </div>
          <span class="mini-sep">:</span>
          <div class="mini-unit">
            <div class="mini-card-container">
              <div class="mini-card-top">2</div>
              <div class="mini-card-bot">2</div>
            </div>
            <span class="mini-label">minutos</span>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="sw-btn sw-btn--ghost" id="theme-cancel-btn">Cancelar</button>
      <button class="sw-btn" id="theme-save-btn">Salvar Tema</button>
    </div>
  </div>
</div>

<!-- TOAST DE NOTIFICAÇÃO -->
<div class="toast" id="toast"></div>

<!-- OVERLAY DE ALARME -->
<div class="alarm-overlay hidden" id="alarm-overlay">
  <div class="alarm-content">
    <div class="alarm-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </div>
    <div class="alarm-text">Tempo esgotado</div>
    <button class="alarm-dismiss" id="alarm-dismiss">Dispensar</button>
  </div>
</div>

<!-- RELÓGIO -->
<div class="page" id="page-clock">
  <div class="clock-wrap">
    <div class="unit">
      <div class="cards" id="h"></div>
      <span class="label">horas</span>
    </div>
    <div class="sep">:</div>
    <div class="unit">
      <div class="cards" id="m"></div>
      <span class="label">minutos</span>
    </div>
    <div class="sep">:</div>
    <div class="unit">
      <div class="cards" id="s"></div>
      <span class="label">segundos</span>
    </div>
  </div>
  <div class="date-display" id="date-display"></div>
</div>

<!-- CRONÔMETRO -->
<div class="page hidden" id="page-stopwatch">
  <div class="clock-wrap">
    <div class="unit">
      <div class="cards" id="sw-m"></div>
      <span class="label">minutos</span>
    </div>
    <div class="sep">:</div>
    <div class="unit">
      <div class="cards" id="sw-s"></div>
      <span class="label">segundos</span>
    </div>
    <div class="sep sw-sep">.</div>
    <div class="unit">
      <div class="cards" id="sw-cs"></div>
      <span class="label">centésimos</span>
    </div>
  </div>
  <div class="sw-controls ui-element">
    <button class="sw-btn" id="sw-startstop">iniciar</button>
    <button class="sw-btn sw-btn--ghost" id="sw-reset">zerar</button>
  </div>
</div>

<!-- TEMPORIZADOR -->
<div class="page hidden" id="page-timer">
  <div class="clock-wrap">
    <div class="unit">
      <div class="cards" id="tm-h"></div>
      <span class="label">horas</span>
    </div>
    <div class="sep">:</div>
    <div class="unit">
      <div class="cards" id="tm-m"></div>
      <span class="label">minutos</span>
    </div>
    <div class="sep">:</div>
    <div class="unit">
      <div class="cards" id="tm-s"></div>
      <span class="label">segundos</span>
    </div>
  </div>

  <div class="tm-setup ui-element" id="tm-setup">
    <div class="tm-input-group">
      <input class="tm-input" id="tm-input-h" type="number" min="0" max="99" value="0" placeholder="00">
      <span class="tm-input-label">h</span>
    </div>
    <span class="tm-input-sep">:</span>
    <div class="tm-input-group">
      <input class="tm-input" id="tm-input-m" type="number" min="0" max="59" value="0" placeholder="00">
      <span class="tm-input-label">m</span>
    </div>
    <span class="tm-input-sep">:</span>
    <div class="tm-input-group">
      <input class="tm-input" id="tm-input-s" type="number" min="0" max="59" value="0" placeholder="00">
      <span class="tm-input-label">s</span>
    </div>
  </div>

  <div class="sw-controls ui-element">
    <button class="sw-btn" id="tm-startstop">iniciar</button>
    <button class="sw-btn sw-btn--ghost" id="tm-reset">zerar</button>
  </div>
</div>

<!-- HINT DE MODO ZEN -->
<div class="zen-hint" id="zen-hint">pressione <kbd>Z</kbd> ou <kbd>F</kbd> para sair</div>

<!-- SCRIPTS -->
<script src="js/themes.js"></script>
<script src="js/effects.js"></script>
<script src="js/skins.js"></script>
<script src="js/custom-themes.js"></script>
<script src="js/script.js"></script>
</body>
</html>
